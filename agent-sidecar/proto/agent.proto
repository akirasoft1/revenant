syntax = "proto3";

package discordbot.agent;

service Agent {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Observe(ObserveRequest) returns (ObserveResponse);
  rpc RunDql(RunDqlRequest) returns (RunDqlResponse);
}

message Turn {
  string role    = 1;  // "user" | "assistant"
  string content = 2;
}

message ChatRequest {
  string user_id        = 1;
  string user_tag       = 2;
  string channel_id     = 3;
  string guild_id       = 4;
  string interaction_id = 5;
  string user_message   = 6;
  string image_url      = 7;
  string system_prompt  = 8;
  string memory_context = 9;
  repeated Turn history = 10;
}

message ChatResponse {
  string message_text          = 1;
  repeated ImageAttachment images = 2;
  ExecutionSummary summary     = 3;
  bool fallback_occurred       = 4;
}

message ExecutionSummary {
  int32 execution_count          = 1;
  bool any_failed                = 2;
  repeated string execution_ids  = 3;
}

message ImageAttachment {
  bytes data        = 1;
  string filename   = 2;
  string mime_type  = 3;
}

message HealthRequest {}
message HealthResponse {
  bool healthy = 1;
}

message ObserveRequest {
  string user_id  = 1;
  string user_tag = 2;
  string question = 3;
}
message ObserveResponse {
  string answer_text = 1;
  string dql_used    = 2;
  string error       = 3;
}
message RunDqlRequest {
  string user_id = 1;
  string query   = 2;
}
message RunDqlResponse {
  string rows_json = 1;  // JSON array of row objects
  string columns   = 2;  // JSON array of column names
  string error     = 3;
}
