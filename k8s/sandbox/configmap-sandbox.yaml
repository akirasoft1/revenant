apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: discord-article-bot
data:
  SANDBOX_INLINE_OUTPUT_CHARS: "750"
  SANDBOX_WALL_CLOCK_SECONDS: "300"
  SANDBOX_PER_USER_CONCURRENCY: "2"
  SANDBOX_GLOBAL_CONCURRENCY: "15"
  SANDBOX_MEMORY_LIMIT: "2Gi"
  SANDBOX_CPU_LIMIT: "2"
  SANDBOX_TRACE_RETENTION_PER_USER: "50"
  SANDBOX_AGENT_TURN_CALL_BUDGET: "8"
  AGENT_ENABLED: "true"
  AGENT_GRPC_ADDR: "discord-article-bot-agent.discord-article-bot.svc.cluster.local:50051"
  # AGENT_MODEL is the LLM the ADK Agent uses.
  #   "gemini-3-flash"            -> native ADK Gemini path (preferred default)
  #   "openai/gpt-5.1"            -> OpenAI via LiteLlm wrapper
  #   "anthropic/claude-opus-..." -> Anthropic via LiteLlm wrapper
  # GEMINI_API_KEY is read from the discord-article-bot-secrets Secret;
  # OPENAI_API_KEY likewise (only used when AGENT_MODEL=openai/...).
  AGENT_MODEL: "gemini-3.6-flash"
  # Dynatrace MCP gateway URL — used by the agent sidecar to reach the
  # dynatrace-mcp server over the platform-reserved MCP gateway endpoint.
  # Non-secret (no token embedded); DT_PLATFORM_TOKEN (Secret) authenticates.
  DT_MCP_URL: "https://qgv89709.apps.dynatrace.com/platform-reserved/mcp-gateway/v0.1/servers/dynatrace-mcp/mcp"
  # --- Agent health circuit breaker (audit 2026-08-14) ---
  # The bot's only circuit breaker for the agent path used to be "is the gRPC
  # port answering", which stayed true through expired Vertex credentials, an
  # unreachable Mongo, and hangs. The sidecar now reports unhealthy after N
  # consecutive Chat failures and recovers via a half-open trial after the
  # cooldown. Raise the threshold to tolerate more flakiness before falling
  # back to direct OpenAI; raise the cooldown to retry a broken backend less
  # often.
  AGENT_HEALTH_FAILURE_THRESHOLD: "3"
  AGENT_HEALTH_COOLDOWN_SECONDS: "60"
  # LOCKSTEP with services/AgentClient.js `chatDeadlineMs` (600000 ms, a
  # constructor default and NOT env-tunable). This MUST stay below it so the
  # sidecar abandons a stuck turn and returns a real error before the bot's own
  # deadline fires — otherwise the bot times out first, the sidecar keeps
  # working on an abandoned turn, and the breaker never learns the turn failed.
  # If you raise this past 600s, change chatDeadlineMs in the same commit.
  AGENT_CHAT_TIMEOUT_SECONDS: "540"
