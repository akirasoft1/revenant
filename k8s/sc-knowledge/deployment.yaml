# Image tags are pinned to the git short-SHA at deploy time, never `:latest`.
# This is a tracked placeholder: the coordinator's deployed overlay
# (k8s/overlays/deployed/, gitignored) carries the real image tag and secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sc-knowledge
  namespace: discord-article-bot
  labels:
    app: sc-knowledge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: sc-knowledge
  template:
    metadata:
      labels:
        app: sc-knowledge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      containers:
        - name: sc-knowledge
          image: mvilliger/sc-knowledge:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SC_KNOWLEDGE_VERSION
              value: "REPLACE_WITH_SHA"
            - name: OTEL_SERVICE_NAME
              value: "sc-knowledge"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://telemetry-ingest.dynatrace.svc.cluster.local:4317"
            - name: UEXCORP_BEARER
              valueFrom:
                secretKeyRef:
                  name: sc-knowledge-secrets
                  key: UEXCORP_BEARER
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
