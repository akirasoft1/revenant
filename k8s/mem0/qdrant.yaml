---
# Qdrant Vector Database for Mem0
# Provides semantic memory storage and retrieval
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: discord-article-bot
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: mem0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: harvester-longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: discord-article-bot
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: mem0
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the storage PVC is RWO, so a surge pod can't
  # attach it while the old pod holds it (and two writers must never share it).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/component: vector-store
        app.kubernetes.io/part-of: mem0
    spec:
      containers:
        - name: qdrant
          # Upgrade ONE MINOR VERSION AT A TIME (storage compat is only guaranteed
          # across one minor). 1.12.4 -> 1.18.3 was stepped through the latest
          # patch of every minor on 2026-09-26; 1.16 migrated RocksDB -> Gridstore.
          image: qdrant/qdrant:v1.18.3
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
          resources:
            # Limits sized for segment merges / HNSW rebuilds of irc_history
            # (~378k x 1536-dim): at 2 CPU / 4Gi a rebuild ran pegged near the
            # memory ceiling. Qdrant sizes optimizer threads from visible CPUs.
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "8"
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: discord-article-bot
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/part-of: mem0
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
  selector:
    app.kubernetes.io/name: qdrant
