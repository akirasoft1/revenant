  <rect width="1280" height="960" fill="url(#bg)"/>

  <!-- Title -->
  <text x="56" y="58" fill="#f0e6d2" font-size="26" font-family="'Fraunces', Georgia, serif" font-style="italic">channel-voice · chat turn &amp; memory store</text>
  <text x="56" y="82" fill="#8a7c66" font-size="11" letter-spacing="1.5">REVENANT — FIG. 01 — CONTEXT PATH (TEAL) · RESPONSE + WRITE-BACK (AMBER) · VOICE (VIOLET) — 2026-10</text>
  <line x1="56" y1="96" x2="1224" y2="96" stroke="#3a2a1f" stroke-width="1"/>

  <!-- ============ ENTRY ============ -->
  <g>
    <rect x="56" y="130" width="170" height="92" rx="4" fill="url(#card)" stroke="#5cbfaf" stroke-width="1.5"/>
    <text x="141" y="156" fill="#5cbfaf" font-size="12" letter-spacing="3" text-anchor="middle">DISCORD</text>
    <text x="141" y="180" fill="#f0e6d2" font-size="15" font-family="'Fraunces', Georgia, serif" font-style="italic" text-anchor="middle">text chat</text>
    <text x="141" y="200" fill="#c9bba3" font-size="11" text-anchor="middle">@mention · reply · /chat</text>
    <text x="141" y="214" fill="#8a7c66" font-size="10" text-anchor="middle">records user turn</text>
  </g>
  <g>
    <rect x="56" y="250" width="170" height="92" rx="4" fill="url(#card)" stroke="#b39ddb" stroke-width="1.5"/>
    <text x="141" y="276" fill="#b39ddb" font-size="12" letter-spacing="3" text-anchor="middle">VOICE</text>
    <text x="141" y="300" fill="#f0e6d2" font-size="15" font-family="'Fraunces', Georgia, serif" font-style="italic" text-anchor="middle">session open</text>
    <text x="141" y="320" fill="#c9bba3" font-size="11" text-anchor="middle">VoiceService (bot)</text>
    <text x="141" y="334" fill="#8a7c66" font-size="10" text-anchor="middle">same builder, empty query</text>
  </g>

  <!-- ============ ORCHESTRATOR ============ -->
  <g>
    <rect x="262" y="180" width="200" height="112" rx="4" fill="url(#card)" stroke="#e89e5e" stroke-width="1.5"/>
    <text x="362" y="206" fill="#e89e5e" font-size="12" letter-spacing="3" text-anchor="middle">ORCHESTRATOR</text>
    <text x="362" y="232" fill="#f0e6d2" font-size="16" font-family="'Fraunces', Georgia, serif" font-style="italic" text-anchor="middle">ChatService</text>
    <text x="362" y="252" fill="#c9bba3" font-size="11" text-anchor="middle">buildTurnContext()</text>
    <text x="362" y="270" fill="#8a7c66" font-size="10" text-anchor="middle">one builder, text + voice</text>
    <text x="362" y="284" fill="#8a7c66" font-size="10" text-anchor="middle">sources fetched in parallel</text>
  </g>
