    <text x="632" y="596" fill="#f0e6d2" font-size="15" font-family="'Fraunces', Georgia, serif" font-style="italic" text-anchor="middle">agent sidecar · Gemini 3.8 Flash (GEAP)</text>
    <text x="632" y="618" fill="#c9bba3" font-size="11" text-anchor="middle">tools: sc_* (sc-knowledge) · google_search</text>
    <text x="632" y="634" fill="#c9bba3" font-size="11" text-anchor="middle">hangar_* edits · run_in_sandbox (last resort)</text>
    <text x="632" y="652" fill="#8a7c66" font-size="10" text-anchor="middle">voice: same context → Gemini 3.8 Live via voice sidecar</text>
  </g>

  <line x1="842" y1="604" x2="882" y2="604" stroke="#e89e5e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrA)"/>
  <text x="863" y="590" fill="#8a7c66" font-size="9" text-anchor="middle">fail</text>
  <g>
    <rect x="884" y="546" width="340" height="116" rx="4" fill="url(#card)" stroke="#e89e5e" stroke-dasharray="5,4"/>
    <text x="1054" y="572" fill="#e89e5e" font-size="12" letter-spacing="3" text-anchor="middle">FALLBACK</text>
    <text x="1054" y="596" fill="#f0e6d2" font-size="15" font-family="'Fraunces', Georgia, serif" font-style="italic" text-anchor="middle">direct OpenAI · gpt-6-luna</text>
    <text x="1054" y="618" fill="#c9bba3" font-size="11" text-anchor="middle">sidecar unhealthy / RPC error / empty turn</text>
    <text x="1054" y="634" fill="#c9bba3" font-size="11" text-anchor="middle">substitute model named to the user</text>
    <text x="1054" y="652" fill="#8a7c66" font-size="10" text-anchor="middle">only this path writes Mem0 personal + token_usage</text>
  </g>

  <!-- ============ WRITE-BACK ============ -->
  <text x="56" y="712" fill="#8a7c66" font-size="11" letter-spacing="3">WRITE-BACK (after the reply, mostly non-blocking)</text>
