    <rect x="56" y="546" width="330" height="116" rx="4" fill="url(#card)" stroke="#5cbfaf" stroke-width="1.5"/>
    <text x="221" y="572" fill="#5cbfaf" font-size="12" letter-spacing="3" text-anchor="middle">ASSEMBLE</text>
    <text x="221" y="596" fill="#f0e6d2" font-size="15" font-family="'Fraunces', Georgia, serif" font-style="italic" text-anchor="middle">{ systemPrompt, memoryBlock, historyTurns }</text>
    <text x="221" y="618" fill="#c9bba3" font-size="11" text-anchor="middle">persona + voice profile + roster</text>
    <text x="221" y="634" fill="#c9bba3" font-size="11" text-anchor="middle">ranked memory · labelled history</text>
    <text x="221" y="652" fill="#8a7c66" font-size="10" text-anchor="middle">agent path: untrimmed · fallback: token-trimmed</text>
  </g>

  <line x1="386" y1="604" x2="420" y2="604" stroke="#5cbfaf" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="403" y="594" fill="#8a7c66" font-size="9" text-anchor="middle">gRPC</text>

  <g>
    <rect x="422" y="546" width="420" height="116" rx="4" fill="url(#card)" stroke="#e89e5e" stroke-width="1.5"/>
