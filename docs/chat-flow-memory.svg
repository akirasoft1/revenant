  <g>
    <rect x="56" y="762" width="268" height="92" rx="4" fill="url(#card)" stroke="#a8b878"/>
    <text x="72" y="786" fill="#a8b878" font-size="12">channelMessageRecorder</text>
    <text x="72" y="806" fill="#c9bba3" font-size="11">user + bot turns, every entry</text>
    <text x="72" y="822" fill="#c9bba3" font-size="11">point → channel_messages</text>
    <text x="72" y="842" fill="#8a7c66" font-size="10">voice turns: source "voice"</text>
  </g>
  <g>
    <rect x="356" y="762" width="268" height="92" rx="4" fill="url(#card)" stroke="#5cbfaf"/>
    <text x="372" y="786" fill="#5cbfaf" font-size="12">ChannelContextService</text>
    <text x="372" y="806" fill="#c9bba3" font-size="11">recordMessage() → hot buffer</text>
    <text x="372" y="822" fill="#c9bba3" font-size="11">batch index every 5 min →</text>
    <text x="372" y="842" fill="#8a7c66" font-size="10">channel_conversations (Qdrant)</text>
  </g>
  <g>
    <rect x="656" y="762" width="268" height="92" rx="4" fill="url(#card)" stroke="#5cbfaf"/>
    <text x="672" y="786" fill="#5cbfaf" font-size="12">channel memory extract</text>
    <text x="672" y="806" fill="#c9bba3" font-size="11">every N channel messages →</text>
    <text x="672" y="822" fill="#c9bba3" font-size="11">Mem0 shared facts</text>
    <text x="672" y="842" fill="#8a7c66" font-size="10">→ discord_memories</text>
  </g>
  <g>
    <rect x="956" y="762" width="268" height="92" rx="4" fill="url(#card)" stroke="#a8b878"/>
    <text x="972" y="786" fill="#a8b878" font-size="12">sidecar + background</text>
    <text x="972" y="806" fill="#c9bba3" font-size="11">sandbox_executions per call</text>
    <text x="972" y="822" fill="#c9bba3" font-size="11">voice profile regen · 24h</text>
    <text x="972" y="842" fill="#8a7c66" font-size="10">recall_ledger touched on access</text>
  </g>

