    <text x="530" y="148" fill="#5cbfaf" font-size="13" letter-spacing="1.5">VoiceProfileService</text>
    <text x="530" y="170" fill="#c9bba3" font-size="11">persona: channel-voice template</text>
    <text x="530" y="187" fill="#c9bba3" font-size="11">{VOICE_INSTRUCTIONS} ← learned style</text>
    <text x="530" y="203" fill="#8a7c66" font-size="10">+ few-shot from irc_history (not ranked)</text>
  </g>

  <g>
    <rect x="512" y="226" width="320" height="140" rx="4" fill="url(#card)" stroke="#3a2a1f"/>
    <text x="530" y="250" fill="#5cbfaf" font-size="13" letter-spacing="1.5">RecallService · ranked recall</text>
    <text x="530" y="272" fill="#c9bba3" font-size="11">over-retrieve 5 sources:</text>
    <text x="544" y="289" fill="#c9bba3" font-size="11">Mem0 personal · explicit · shared</text>
    <text x="544" y="306" fill="#c9bba3" font-size="11">channel semantic · channel facts</text>
    <text x="530" y="326" fill="#e8c27e" font-size="11">dedupe → ledger → 14-day decay</text>
    <text x="530" y="343" fill="#8a7c66" font-size="10">→ one "## Memory Context" block</text>
    <text x="530" y="358" fill="#8a7c66" font-size="10">RECALL_V2_ENABLED=true · shadow on</text>
  </g>

  <g>
    <rect x="512" y="382" width="320" height="112" rx="4" fill="url(#card)" stroke="#3a2a1f"/>
    <text x="530" y="406" fill="#5cbfaf" font-size="13" letter-spacing="1.5">History + identity</text>
    <text x="530" y="428" fill="#c9bba3" font-size="11">channel_messages · bot-inclusive</text>
    <text x="530" y="445" fill="#c9bba3" font-size="11">turns labelled [Name · discordId]</text>
    <text x="530" y="462" fill="#c9bba3" font-size="11">roster ← MemberIdentityService</text>
    <text x="530" y="482" fill="#8a7c66" font-size="10">reply target named on current turn</text>
  </g>

  <!-- ============ STORES ============ -->
  <text x="884" y="116" fill="#8a7c66" font-size="11" letter-spacing="3">STORES</text>
  <g>
    <rect x="884" y="124" width="340" height="168" rx="4" fill="url(#card)" stroke="#5cbfaf" stroke-width="1.5"/>
    <text x="904" y="150" fill="#5cbfaf" font-size="13" letter-spacing="3">QDRANT 1.18 · 1536d</text>
    <line x1="904" y1="160" x2="1204" y2="160" stroke="#3a2a1f"/>
    <text x="904" y="182" fill="#f0e6d2" font-size="13" font-style="italic">discord_memories</text>
    <text x="1204" y="182" fill="#8a7c66" font-size="10" text-anchor="end">Mem0 v3 facts</text>
    <text x="904" y="206" fill="#f0e6d2" font-size="13" font-style="italic">channel_conversations</text>
    <text x="1204" y="206" fill="#8a7c66" font-size="10" text-anchor="end">semantic · 180d</text>
    <text x="904" y="230" fill="#f0e6d2" font-size="13" font-style="italic">irc_history</text>
    <text x="1204" y="230" fill="#8a7c66" font-size="10" text-anchor="end">~378k · few-shot</text>
    <text x="904" y="258" fill="#8a7c66" font-size="10">embed: text-embedding-3-small</text>
    <text x="904" y="276" fill="#8a7c66" font-size="10">Mem0 runs on Qdrant only (no Postgres)</text>
  </g>
  <g>
    <rect x="884" y="308" width="340" height="186" rx="4" fill="url(#card)" stroke="#a8b878" stroke-width="1.5"/>
    <text x="904" y="334" fill="#a8b878" font-size="13" letter-spacing="3">MONGODB · documents</text>
    <line x1="904" y1="344" x2="1204" y2="344" stroke="#3a2a1f"/>
    <text x="904" y="366" fill="#f0e6d2" font-size="13" font-style="italic">channel_messages</text>
    <text x="1204" y="366" fill="#8a7c66" font-size="10" text-anchor="end">history · text + voice</text>
    <text x="904" y="390" fill="#f0e6d2" font-size="13" font-style="italic">voice_profiles</text>
    <text x="1204" y="390" fill="#8a7c66" font-size="10" text-anchor="end">versioned</text>
    <text x="904" y="414" fill="#f0e6d2" font-size="13" font-style="italic">recall_ledger</text>
    <text x="1204" y="414" fill="#8a7c66" font-size="10" text-anchor="end">importance · access</text>
    <text x="904" y="438" fill="#f0e6d2" font-size="13" font-style="italic">member_identities</text>
    <text x="1204" y="438" fill="#8a7c66" font-size="10" text-anchor="end">/whois · cached</text>
    <text x="904" y="462" fill="#f0e6d2" font-size="13" font-style="italic">sandbox_executions</text>
    <text x="1204" y="462" fill="#8a7c66" font-size="10" text-anchor="end">agent traces</text>
    <text x="904" y="484" fill="#8a7c66" font-size="10">+ chat_conversations, token_usage (fallback path)</text>
  </g>
